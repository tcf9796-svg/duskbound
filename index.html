<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duskbound">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0b0d14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Duskbound</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d14;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#e8e2d0;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
  /* iPhone notch / Dynamic Island / home bar: read by game.js to keep the HUD and touch buttons clear of them. */
  #sa{position:fixed;visibility:hidden;pointer-events:none;top:0;left:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  canvas#game{position:fixed;left:0;top:0;display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
  /* iPhone Safari hides its bars only when the page scrolls: there the page gets a little room to scroll (game.js adds .iosbar). */
  html.iosbar{height:auto;overflow-x:hidden;overflow-y:auto}
  html.iosbar body{height:auto;overflow:visible;overscroll-behavior:auto}
  html.iosbar body::after{content:'';display:block;height:calc(100vh + 200px)}
  /* A swipe on a fixed layer never scrolls the page in iPhone Safari, so there the menus are part of the page:
     sticky at the top, so swiping on them scrolls the page (and Safari hides its bars) while they stay in view. */
  html.iosbar #overlay{position:sticky;inset:auto;top:0;height:100vh}
  #swipehint{display:none;position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));padding:6px 14px;border-radius:16px;
    background:rgba(243,212,138,.92);color:#1a1626;font-size:14px;white-space:nowrap;pointer-events:none;animation:swipe 1.6s ease-in-out infinite}
  body.bars.menu #swipehint{display:block}
  @keyframes swipe{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
  input{-webkit-user-select:text;user-select:text}
  #choice.solo{overflow:auto}
  #rotate{display:none;position:fixed;inset:0;z-index:9;background:#0b0d14;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px;color:#f3d48a;line-height:1.6}
  @media (orientation:portrait) and (pointer:coarse){body:not(.upright):not(.installing) #rotate{display:flex}}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:safe center;flex-direction:column;
    background:radial-gradient(ellipse at 50% 30%,rgba(38,32,64,.93),rgba(7,8,14,.97));text-align:center;box-sizing:border-box;overflow:auto;-webkit-overflow-scrolling:touch;
    padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  #overlay.hidden,#choice.hidden{display:none}
  #overlay.soft{background:rgba(8,9,18,.78)}
  #choice{position:fixed;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center}
  #choice.solo{inset:0;justify-content:center;background:rgba(8,9,18,.78);box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #choice.coop{top:calc(118px + env(safe-area-inset-top));pointer-events:none}
  #choice.coop h2{font-size:20px;text-shadow:0 2px 6px #000}
  #choice.coop .card{pointer-events:auto;width:200px;padding:10px 12px;background:linear-gradient(rgba(35,32,56,.94),rgba(22,21,35,.94))}
  #choice.coop .card h3{font-size:17px}
  #choice.coop .card p{font-size:12.5px;margin-top:4px}
  h1{font-size:60px;letter-spacing:10px;margin:0;color:#f3d48a;text-shadow:0 0 24px rgba(243,170,80,.5)}
  h2{font-size:32px;margin:0 0 6px;color:#f3d48a;letter-spacing:3px}
  .sub{color:#a9a3c4;margin:8px 0 18px;font-style:italic;max-width:680px;line-height:1.45}
  .cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  .card{width:240px;background:linear-gradient(#232038,#161523);border:1px solid #4a4370;border-radius:10px;padding:14px 16px;
    cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;text-align:left;position:relative}
  .card:hover{transform:translateY(-4px);border-color:#f3d48a;box-shadow:0 8px 30px rgba(243,190,100,.22)}
  .card.sel{border-color:#f3d48a;box-shadow:0 0 0 2px #f3d48a,0 8px 30px rgba(243,190,100,.25)}
  .card h3{margin:4px 0 0;font-size:22px;color:#fff}
  .card .tag{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#f3d48a}
  .card p{font-size:13.5px;line-height:1.45;color:#c9c4dc;margin:8px 0 0}
  .card ul{padding-left:16px;margin:8px 0 0;font-size:12.5px;color:#aaa5c2;line-height:1.5}
  .card.compact ul{font-size:11.5px;line-height:1.4}
  .card canvas{display:block;margin:0 auto 6px}
  .card .key{position:absolute;top:8px;right:10px;font-size:12px;color:#77719a;border:1px solid #4a4370;border-radius:4px;padding:1px 6px}
  .pips{color:#f3d48a;letter-spacing:3px;font-size:12px;margin-top:8px}
  .controls{margin-top:16px;font-size:13px;color:#8e88ab;line-height:1.7}
  .controls b{color:#d8d2ee;font-weight:normal;border:1px solid #4a4370;border-radius:4px;padding:0 5px;margin:0 2px}
  .row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .row .sep{width:1px;height:30px;background:#4a4370;margin:0 6px}
  input{font-family:inherit;font-size:16px;padding:9px 12px;background:#14131f;color:#e8e2d0;border:1px solid #4a4370;border-radius:6px;width:150px;outline:none}
  input:focus{border-color:#f3d48a}
  #code{width:86px;text-transform:uppercase;letter-spacing:3px;text-align:center}
  button{font-family:inherit;font-size:17px;padding:9px 22px;background:#f3d48a;color:#1a1626;border:0;border-radius:6px;cursor:pointer;letter-spacing:1px}
  button:hover{background:#ffe7aa}
  button.ghost{background:transparent;color:#c9c4dc;border:1px solid #4a4370}
  button.ghost:hover{border-color:#f3d48a;color:#fff;background:transparent}
  #overlay>button{margin-top:18px}
  #msg{min-height:20px;margin-top:10px;color:#ff9b8a;font-size:14px}
  .code{font-style:normal;font-size:30px;letter-spacing:8px;color:#fff;background:#14131f;border:1px solid #4a4370;border-radius:6px;padding:2px 10px 2px 18px;margin-left:8px;user-select:all}
  .plist{font-size:16px;line-height:1.8;margin-bottom:16px;color:#e8e2d0}
  .plist i{color:#8e88ab}
  .wait{color:#a9a3c4;font-style:italic;margin-top:14px}
  .stats{color:#c9c4dc;font-size:15px;line-height:1.8;margin-top:6px}
  .stats b{color:#f3d48a;font-weight:normal}
  .prof{text-align:left;max-width:760px}
  select{font-family:inherit;font-size:16px;padding:7px 10px;background:#14131f;color:#e8e2d0;border:1px solid #4a4370;border-radius:6px;max-width:100%}
  .wsel{font-size:13px;padding:3px 6px}
  .vrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0} .vrow button{font-size:13px;padding:4px 10px} .vvol{width:140px}
  .pcode{width:min(620px,90vw);font-size:12px;background:#14131f;color:#e8e2d0;border:1px solid #4a4370;border-radius:6px;margin-top:8px;-webkit-user-select:text;user-select:text}
  /* Language switch: always in the title screen's top corner. */
  .fsbtn{position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));font-size:14px;padding:6px 12px;background:rgba(20,19,31,.85)}
  .steps{text-align:left;max-width:520px;line-height:1.7;font-size:16px;color:#e8e2d0;margin:4px 0 6px;padding-left:22px}
  .steps b{color:#f3d48a;font-weight:normal}
  .langbtn{position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));font-size:14px;padding:6px 12px;background:rgba(20,19,31,.85)}
  .card.locked{cursor:default;opacity:.6}
  .card.locked:hover{transform:none;border-color:#4a4370;box-shadow:none}
  .card.locked canvas{filter:grayscale(.7) brightness(.55)}
  .card .lock{font-style:italic;color:#a9a3c4}
  .rar{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;border:1px solid;border-radius:4px;padding:0 5px;margin-left:8px;vertical-align:middle;white-space:nowrap;display:inline-block}
  .reward{color:#d8d2ee;font-size:15px;margin-top:8px}
  .reward.won{font-size:18px;color:#f3d48a}
  /* Phones in landscape: must stay after the base rules so it wins. */
  @media (max-height:540px){
    .langbtn,.fsbtn{font-size:12px;padding:4px 9px;top:max(6px,env(safe-area-inset-top))} .steps{font-size:13px;line-height:1.5}
    #overlay .cards{flex-wrap:nowrap;max-width:100%} #overlay .card{flex:0 1 190px;min-width:0;box-sizing:border-box}
    #overlay{padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom))}
    h1{font-size:30px;letter-spacing:6px} h2{font-size:20px;margin-bottom:2px}
    .sub{margin:2px 0 8px;font-size:12.5px;line-height:1.35} .cards{gap:8px}
    .card{width:190px;padding:6px 10px} .card p{display:none} .card h3{font-size:16px} .card .tag{font-size:9.5px;letter-spacing:1px}
    .card ul{font-size:10.5px;line-height:1.3;margin-top:3px} .card canvas{height:56px;width:auto;margin-bottom:0}
    .card .key{display:none}
    #choice .card p{display:block} #choice.coop{top:calc(70px + env(safe-area-inset-top))} #choice.coop h2{font-size:16px} #choice.coop .card{width:160px;padding:6px 10px}
    #choice.coop .card p{font-size:11px}
    .row{margin-top:8px;gap:6px} .row .sep{display:none} button{font-size:14px;padding:7px 12px}
    input{font-size:16px;padding:6px 9px;width:110px} #code{width:76px}
    .controls{margin-top:6px;font-size:11px;line-height:1.5} #msg{margin-top:4px;min-height:0}
    .plist{font-size:13px;line-height:1.45;margin-bottom:6px} .code{font-size:20px;letter-spacing:5px} .stats{font-size:13px;line-height:1.5}
  }
  @media (max-height:420px){ .card ul{display:none} .card{width:150px} h1{font-size:26px} #overlay .card{flex-basis:160px} }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="choice" class="hidden"></div>
<div id="overlay"></div>
<div id="sa"></div>
<div id="swipehint"></div>
<div id="rotate"><div><span class="rt1">Turn your phone sideways</span><br><span class="rt2" style="color:#a9a3c4;font-size:15px;font-style:italic">Duskbound plays best in landscape.</span><br><button id="rotok" type="button" style="margin-top:16px">Play upright anyway</button></div></div>
<script>document.getElementById('rotok').onclick = function () { document.body.classList.add('upright'); };</script>
<script async src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="data.js?v=30"></script>
<script src="i18n.js?v=30"></script>
<script src="meta.js?v=30"></script>
<script src="cloud.js?v=30"></script>
<script src="art.js?v=30"></script>
<script src="audio.js?v=30"></script>
<script src="voice.js?v=30"></script>
<script src="bosses.js?v=30"></script>
<script src="game.js?v=30"></script>
</body>
</html>
